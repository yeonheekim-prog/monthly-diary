<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="월간다이어리">
<meta name="theme-color" content="#faf8f2">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>월간 다이어리</title>
<style>
:root{
  --bg:#f3f1ea; --paper:#fffdf8; --ink:#2b2b2b; --sub:#7a776f; --line:#e2ded3;
  --green:#2e6b4e; --green2:#cfe3d6; --green3:#eef5f0; --side:#dfece4; --sat:#8a8a8a; --navy:#3b4b9a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}

/* 머리 */
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(4px + env(safe-area-inset-top)) 8px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.mnav{display:flex;align-items:center;gap:0;min-width:0}
.iconbtn{min-width:44px;height:44px;border:0;background:none;font-size:18px;color:var(--green);border-radius:10px}
.iconbtn:active{background:var(--green3)}
.iconbtn[hidden]{visibility:hidden;display:inline-block}
#label{border:0;background:none;font-size:18px;font-weight:700;color:var(--ink);padding:0 4px;height:44px;white-space:nowrap}
#pageTitle{font-size:12px;color:var(--green);margin-right:4px;white-space:nowrap}
@media (max-width:480px){#pageTitle{display:none}}
.idx{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 0 6px}
.idx::-webkit-scrollbar{display:none}
.idx button{flex:none;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;color:var(--sub)}
.idx button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}

main{max-width:1100px;margin:0 auto;padding:10px 8px}

/* 종이 */
.spread{display:grid;gap:6px;margin-bottom:8px}
.two{grid-template-columns:1fr 1fr}
.page{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0;display:flex;flex-direction:column}
.lab{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--green);margin-bottom:2px;white-space:nowrap}
.lab::before{content:"•"} .lab::after{content:"•"}
.lab.r{justify-content:flex-end}
.lab small{font-weight:400;color:var(--sub);font-size:11px;white-space:normal}
.ymd{font-size:13px;color:var(--sub);margin-bottom:4px}
.ymd b{color:var(--navy);font-size:15px}
textarea,input[type=text]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;outline:none;resize:none;padding:0 2px;border-radius:0}
textarea{line-height:1.75;display:block;
  background-image:linear-gradient(transparent calc(1.75em - 1px),var(--line) 1px);background-size:100% 1.75em;background-attachment:local}
textarea.grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:12px 12px;background-color:#fffefa;border:1px solid var(--line);padding:2px 4px}
textarea.plain{background-image:none}
input[type=text]{border-bottom:1px solid var(--line);height:32px}
textarea:focus,input[type=text]:focus{background-color:#fffbe6}
textarea.fill{flex:1;min-height:0;height:100%}
.flex1{flex:1;display:flex;flex-direction:column}

details.how{background:var(--green3);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px;color:#33463c}
details.how summary{font-weight:700;color:var(--green);cursor:pointer;min-height:26px}
details.how ul{margin:6px 0 0;padding-left:18px}
details.how li{margin:3px 0}
.btn{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--green);background:#fff;color:var(--green);font:inherit;font-size:14px;font-weight:600}
.btn.fill{background:var(--green);color:#fff}
.btn.small{min-height:32px;font-size:12px;padding:0 8px;border-radius:8px}
.btn:active{opacity:.7}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.muted{color:var(--sub);font-size:12px}
.tip{display:none;font-size:12px;color:var(--sub);text-align:center;margin:0 0 6px}
@media (max-width:560px){.tip{display:block}}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{min-height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--green);background:#fff;color:var(--green);font:inherit;font-size:13px}
.chip.half{background:var(--green3)}
.chip.on{background:var(--green);color:#fff}

/* 자기선언 */
.declpage{max-width:620px;margin:0 auto;padding:18px 16px}
.declpage h2{text-align:center;font-size:18px;font-weight:500;margin:4px 0 14px}
.decl{display:flex;gap:6px;align-items:flex-start;border-bottom:1px solid var(--line)}
.decl .dot{color:var(--ink);padding-top:9px}
.decl textarea{background:none;font-size:16px;line-height:1.5;padding:8px 0}
.decl .del{min-width:32px;height:36px;border:0;background:none;color:#c9c4b8;font-size:16px}
.who{margin:28px 0 0 auto;max-width:300px}
.who label{display:flex;align-items:flex-end;gap:8px;font-size:13px;color:var(--sub);margin-top:6px}
.who label span{min-width:56px}
.today-decl{font-size:15px;font-weight:600;line-height:1.45}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.15fr;border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff}
.cal .h{font-size:10px;font-weight:700;text-align:center;padding:4px 0;color:var(--sub);border-right:1px solid var(--line);border-bottom:1px solid var(--line);letter-spacing:.3px}
.cal .h.sat{background:#e9e9e9} .cal .h.sun{background:var(--green3);color:var(--green)}
.cal .d{min-height:84px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 3px;font-size:10px;line-height:1.3;overflow:hidden;cursor:pointer;word-break:break-all;position:relative}
.cal .d .n{font-size:13px;color:var(--navy);font-family:"Segoe Print","Bradley Hand",cursive,sans-serif}
.cal .d.off{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#faf9f5 6px,#faf9f5 7px);cursor:default}
.cal .d.today{background:#fff8dc}
.cal .d .dots{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--green)}
.cal .memo{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px}
.cal .memo textarea{height:100%;font-size:11px;line-height:1.6}

/* 인생지도 */
.lifemap{position:relative;width:100%;aspect-ratio:1/1;margin:2px auto 6px}
.lifemap svg{position:absolute;inset:0;width:100%;height:100%}
.goalsbox{position:absolute;left:23%;top:23%;width:54%;height:54%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px}
.goalsbox b{color:var(--green);font-size:11px}
.goalsbox textarea{background:none;text-align:center;font-size:11px;line-height:1.4;height:80%;padding:0 8%;scrollbar-width:none}
.goalsbox textarea::-webkit-scrollbar{display:none}
.area{position:absolute;width:auto;max-width:34%;transform:translate(-50%,-50%);text-align:center;border:0;background:var(--paper);font:inherit;padding:2px;cursor:pointer;border-radius:8px}
.area:active{background:var(--green3)}
.area b{display:block;color:var(--green);font-size:11px;white-space:nowrap}
.area small{display:block;font-size:9px;color:var(--ink);line-height:1.25;max-height:2.6em;overflow:hidden}
.hab{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.box{border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;background:#fff;min-width:0}
.hab .lab{white-space:normal;font-size:11px;line-height:1.2}
.box textarea{flex:1}

/* 로드맵 */
.rmwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:#fff}
table.rm{border-collapse:separate;border-spacing:0}
table.rm th,table.rm td{border-bottom:1px solid var(--line);border-right:1px solid #f0ede6;padding:0;text-align:center}
table.rm th{font-size:11px;font-weight:600;color:var(--sub);height:34px;min-width:30px;line-height:1.1;background:#fff}
table.rm th.sun{color:var(--green)} table.rm th.sat{color:var(--sat)}
table.rm th.today{background:#fff3c4;color:var(--ink)}
table.rm th.half{border-left:2px solid #cfcabd}
table.rm .name{position:sticky;left:0;z-index:2;background:#fff;min-width:104px;max-width:104px;border-right:1px solid var(--line)}
table.rm .name input{border:0;font-size:13px;padding:4px 6px;height:46px}
table.rm td.c{width:30px;height:46px;cursor:pointer}
table.rm td.c span{display:block;margin:6px 3px;height:32px;border-radius:5px}
table.rm td.c.s1 span{background:var(--green2)}
table.rm td.c.s2 span{background:var(--green)}
table.rm td.c.half{border-left:2px solid #cfcabd}
.legend{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--sub);margin:6px 2px;flex-wrap:wrap}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:3px}

/* 루틴 */
.rts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rt .rtn{font-size:14px;font-weight:700;color:var(--ink);font-style:italic}
.rt .rtn::after{content:" •";color:var(--green)}
.rt .f{font-size:10px;color:var(--sub);display:block;margin-top:2px}
.rt .tp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rt .cbox{border:1px solid var(--line);border-radius:6px;padding:2px 4px;margin-top:4px;background:#fff}
.checker{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px;margin-top:4px}
.checker button{height:28px;border-radius:5px;border:1px solid var(--line);background:#fff;font:inherit;font-size:11px;color:var(--ink);padding:0}
.checker button.k10{color:var(--green);font-weight:700}
.checker button.on{background:var(--green);border-color:var(--green);color:#fff}
.checker button.today{outline:2px solid #e9c46a}
.stat{font-size:11px;color:var(--green);font-weight:700}

/* 주간 */
.wk{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff}
.wk th,.wk td{border:1px solid var(--line);padding:0;vertical-align:top}
.wk th{font-size:10px;font-weight:600;color:var(--sub);height:34px;line-height:1.15;cursor:pointer;background:#fff}
.wk th b{display:block;font-size:13px;color:var(--navy)}
.wk th.sat{background:#e9e9e9} .wk th.sun{background:var(--green3);color:var(--green)}
.wk th.today{background:#fff3c4}
.wk col.tc{width:20%}
.wk td.tn input{border:0;height:auto;min-height:52px;font-size:12px;padding:2px 4px;text-align:center;background:var(--green3);font-weight:600}
.wk td.wc{height:52px;font-size:10px;line-height:1.25;cursor:pointer;padding:2px;word-break:break-all;overflow:hidden}
.wk td.wc.s1{background:var(--green3);box-shadow:inset 3px 0 var(--green2)}
.wk td.wc.s2{background:var(--green2);box-shadow:inset 3px 0 var(--green)}
.wk td.wc.s2::before{content:"✓ ";color:var(--green);font-weight:700}
.lf{font-size:13px;margin:4px 0;display:flex;gap:6px;align-items:flex-start}
.lf span{flex:1}

/* 하루 */
.daily{display:grid;grid-template-columns:1.05fr .95fr 1.1fr;grid-template-rows:auto auto 1fr 1fr 1fr auto;gap:0 6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px}
.daily .dh{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:baseline}
.daily .ph{grid-column:1;grid-row:2}.daily .ch{grid-column:2;grid-row:2}.daily .rh{grid-column:3;grid-row:2}
.daily .lab{white-space:normal;line-height:1.2;align-items:flex-end;min-height:30px}
.daily .ch .lab{font-size:11px}
.daily .pcell{grid-column:1;display:grid;grid-template-columns:20px 1fr;gap:3px;padding-bottom:4px}
.daily .ccell{grid-column:2;padding-bottom:4px;display:flex}
.daily .ccell textarea,.daily .pcell textarea{height:100%}
.daily .side{background:var(--side);border-radius:4px;color:var(--green);font-size:11px;writing-mode:vertical-rl;text-align:center;letter-spacing:2px;padding:4px 0}
.daily .rec{grid-column:3;grid-row:3 / span 3;display:grid;grid-template-columns:26px 1fr;border-top:1px solid var(--line)}
.daily .see{grid-column:1 / span 2;grid-row:6;margin-top:8px}
.daily .praise{grid-column:3;grid-row:6;margin-top:8px;display:flex;flex-direction:column}
.rec .h{background:var(--side);color:#4b6b5a;font-size:12px;text-align:center;line-height:1;padding-top:8px;border-bottom:1px solid #fff;height:32px}
.rec .h.k{color:var(--green);font-weight:700}
.rec .h small{display:block;font-size:7px}
.rec .h.now{background:#f6dd8a;color:var(--ink)}
.rec input{border-bottom:1px solid var(--line);height:32px;font-size:12px;padding:0 4px}
.l4 .it{display:grid;grid-template-columns:62px 1fr;gap:4px;align-items:start;border-bottom:1px solid var(--line);padding:2px 0}
.l4 .it b{font-size:13px;color:var(--navy);font-style:italic;padding-top:3px}
.l4 .it b small{display:block;font-style:normal;font-weight:400;font-size:10px;color:var(--sub)}
.l4 textarea{background-image:none;font-size:13px}

/* 메모 */
.memo4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.memo4 .page .ttl{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 2px 4px}
.memo4 textarea{flex:1}

/* 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 8px;font-size:17px}
.sheet textarea,.sheet input[type=text]{font-size:16px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0}
.seg3 button{height:40px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px}
.seg3 button.on{background:var(--green);color:#fff;border-color:var(--green)}
.read-all p{font-size:18px;margin:10px 0;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.show{opacity:.92}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="mnav">
      <button class="iconbtn" id="prevBtn" aria-label="이전">◀</button>
      <button id="label" aria-label="오늘로"></button>
      <button class="iconbtn" id="nextBtn" aria-label="다음">▶</button>
    </div>
    <div class="row" style="flex-wrap:nowrap"><span id="pageTitle"></span><button class="iconbtn" id="menuBtn" aria-label="메뉴">⋯</button></div>
  </div>
  <nav class="idx" id="idx"></nav>
</header>

<main id="view"></main>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json,.txt" style="display:none">

<script>
(function(){
'use strict';
var KEY='monthlyDiary_v1';
// 페이지 순서 = 다이어리 순서. unit: 화살표가 넘기는 단위(m=달, w=주, d=날)
var PAGES=[
  {id:'decl',name:'자기선언',title:'',unit:''},
  {id:'cal',name:'달력',title:'Monthly-Schedule',unit:'m'},
  {id:'life',name:'인생지도',title:'Life Location',unit:'m'},
  {id:'plan',name:'월간계획',title:'Monthly-Plan',unit:'m'},
  {id:'road',name:'로드맵',title:'Monthly-Road Map',unit:'m'},
  {id:'routine',name:'루틴',title:'Monthly-Routine Challenge',unit:'m'},
  {id:'week',name:'주간',title:'Weekly-Plan',unit:'w'},
  {id:'day',name:'데일리',title:'Daily-Plan',unit:'d'},
  {id:'memo',name:'메모',title:'Memo',unit:'d'}
];
var PG={};PAGES.forEach(function(p){PG[p.id]=p;});
var DOW=['월','화','수','목','금','토','일'];
var DOWE=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
var AREA_NAMES=['일','자기성장','가족','인간관계','향유'];
var RM_ROWS=8;

/* ---------- 저장 ---------- */
var D;
function blankMonth(){
  var areas=[];for(var i=0;i<5;i++)areas.push({name:AREA_NAMES[i],text:''});
  var rows=[];for(var j=0;j<RM_ROWS;j++)rows.push({name:'',cells:{}});
  var rts=[];for(var k=0;k<4;k++)rts.push({title:'',time:'',place:'',contents:'',checks:{}});
  return {
    life:{goals:'',areas:areas,good:'',bad:'',habit:'',memo:'',memo2:''},
    plan:{text:'',csf:'',see:'',praise:''},
    road:{rows:rows,memo:''},
    routine:rts,
    cal:{notes:{},memo:''}
  };
}
function blankDay(){return {pm:'',pd:'',pn:'',csfm:'',csfd:'',csfn:'',rec:{},like:'',lack:'',learn:'',longfor:'',praise:'',memo:{idea:'',talk:'',read:'',etc:''}};}
function blankWeek(){return {plan:'',csf:'',tasks:['','','','','','','',''],cells:{},see:'',praise:''};}
function dayData(s,create){if(!D.days[s]){if(!create)return null;D.days[s]=blankDay();}return D.days[s];}
function weekData(s,create){if(!D.weeks[s]){if(!create)return null;D.weeks[s]=blankWeek();}return D.weeks[s];}

function load(){
  try{var s=localStorage.getItem(KEY);if(s)D=JSON.parse(s);}catch(e){D=null;}
  if(!D||!D.months){D={v:1,months:{},tab:'day'};seed();}
  fixD();
}
function seed(){
  // 종이 다이어리 사진(2026-10-12)에 적혀 있던 내용
  var m=blankMonth();
  m.life.goals="'호주는 달라' 채널로 월 매출 50만원 만들기\n자신감으로 얼굴에서 빛나는 사람 되기 (빛나연)";
  m.cal.notes={1:'검진',3:'멜버른',4:'멜버른',5:'멜버른',6:'멜버른',7:'치과, 물리치료'};
  m.cal.memo='10/1 검진\n10/3~10/6 멜버른';
  D.months['2026-10']=m;
}
function seedWeekCells(w){
  // Weekly-Plan 10/5~11 사진에서 글씨가 놓인 줄 위치대로. (?)는 판독이 불확실한 글자
  w.cells={'0-2':{t:'사진 옮기기',s:0},'2-2':{t:'헬스(?)',s:0},'4-2':{t:'베이글 / 스벅',s:0},
           '0-3':{t:'키워드·주제',s:0},'2-3':{t:'생파 가예약(?)',s:0},'3-4':{t:'데이트',s:0}};
}
function fixD(){
  if(!D.days)D.days={};
  if(!D.weeks)D.weeks={};
  if(!D.weeks['2026-10-05']&&!D.seededWeek){
    var w=blankWeek();w.plan='10/3~10/6 멜버른\n10/7 치과, 물리치료\n영상 업로드';
    w.tasks=['영상','주식(?)','운익(?)','남편','나','루틴','',''];seedWeekCells(w);D.weeks['2026-10-05']=w;
  }
  D.seededWeek=true;
  if(!D.decl)D.decl={lines:[
    "나는 '그릿'이 있는 사람이 되었다.",
    "나는 '유머'가 있는 사람이 되었다.",
    "나는 '귀티' 나는 사람이 되었다.",
    "나는 내가 '좋아하는 것'을 고르는 사람이 되었다.",

/* ---------- 날짜 ---------- */
function keyOf(y,m){return y+'-'+(m<10?'0':'')+m;}
function thisKey(){var t=new Date();return keyOf(t.getFullYear(),t.getMonth()+1);}
function ym(key){var p=key.split('-');return {y:+p[0],m:+p[1]};}
function shift(key,n){var a=ym(key);var d=new Date(a.y,a.m-1+n,1);return keyOf(d.getFullYear(),d.getMonth()+1);}
function daysIn(key){var a=ym(key);return new Date(a.y,a.m,0).getDate();}
function dowMon(key,day){var a=ym(key);return (new Date(a.y,a.m-1,day).getDay()+6)%7;} // 0=월 … 6=일
function todayDay(key){return thisKey()===key?new Date().getDate():0;}
function fmt(d){return keyOf(d.getFullYear(),d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=pd(s);return fmt(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));}
function mondayOf(s){return addDays(s,-dowOf(s));}
function todayStr(){return fmt(new Date());}
function md(s){var d=pd(s);return (d.getMonth()+1)+'/'+d.getDate();}
function dowOf(s){return (pd(s).getDay()+6)%7;}
function roadOn(s){
  var m=D.months[s.slice(0,7)],day=+s.slice(8),out=[];
  if(!m)return out;
  m.road.rows.forEach(function(r,i){if(r.name&&r.cells[day])out.push({r:i,name:r.name,s:r.cells[day]});});
  return out;
}
function month(key){
  key=key||D.cur;
  if(!D.months[key]){
    var m=blankMonth(),prev=D.months[shift(key,-1)];
    if(prev){ // 매달 다시 그리되, 지난달 것을 밑그림으로
      m.life.goals=prev.life.goals;
      m.life.areas=prev.life.areas.map(function(a){return {name:a.name,text:a.text};});
      m.life.good=prev.life.good;m.life.bad=prev.life.bad;
      m.routine=prev.routine.map(function(r){return {title:r.title,time:r.time,place:r.place,contents:r.contents,checks:{}};});
    }
    D.months[key]=m;
  }
  return D.months[key];
}

/* ---------- 도우미 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function getP(obj,path){return path.split('.').reduce(function(o,k){return o==null?o:o[k];},obj);}
function setP(obj,path,v){var ks=path.split('.'),o=obj;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}
// 경로 앞머리: '@g.'=자기선언, '@d.'=고른 날, '@w.'=고른 주, 없으면 고른 달
function rootOf(path,create){
  if(path.indexOf('@g.')===0)return [D.decl,path.slice(3)];
  if(path.indexOf('@d.')===0)return [dayData(D.sel,create),path.slice(3)];
  if(path.indexOf('@w.')===0)return [weekData(mondayOf(D.sel),create),path.slice(3)];
  return [month(),path];
}
function getV(path){var r=rootOf(path,false);return r[0]?getP(r[0],r[1]):'';}
function setV(path,v){var r=rootOf(path,true);setP(r[0],r[1],v);}
function ta(path,ph,cls,rows){return '<textarea class="'+(cls||'')+'" data-k="'+path+'" rows="'+(rows||3)+'" placeholder="'+esc(ph||'')+'">'+esc(getV(path))+'</textarea>';}
function inp(path,ph){return '<input type="text" data-k="'+path+'" value="'+esc(getV(path))+'" placeholder="'+esc(ph||'')+'">';}
function grow(el){
  if(el.tagName!=='TEXTAREA'||el.classList.contains('fill')||el.closest('.goalsbox')||el.closest('.daily .pcell')||el.closest('.daily .ccell')||el.closest('.cal'))return;
  el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';
}
var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},1300);}
function how(title,items){return '<details class="how"><summary>'+title+'</summary><ul>'+items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul></details>';}
function lab(t,small,right){return '<div class="lab'+(right?' r':'')+'">'+t+(small?' <small>'+small+'</small>':'')+'</div>';}
function ymLine(){var a=ym(D.cur);return '<div class="ymd"><b>'+a.y+'</b> 년 <b>'+a.m+'</b> 월</div>';}
function scrollKeep(fn){var y=window.scrollY;fn();window.scrollTo(0,y);}

function rCal(){
  var m=month(),n=daysIn(D.cur),td=todayDay(D.cur),off=dowMon(D.cur,1);

  var cells='';

      if(!n||names.indexOf(n)>=0)return;
      var slot=names.indexOf('');if(slot<0){full++;return;}
      m.road.rows[slot].name=n;names[slot]=n;added++;
    });
    save(true);
    if(added){toast(added+'개 올렸어요'+(full?' (칸 부족 '+full+'개)':''));openPage('road');}
    else toast(full?'로드맵 8칸이 꽉 찼어요':'새로 올릴 줄이 없어요');
  };

}

    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){toast('복사했어요');},function(){fallbackCopy(s);});}
    else fallbackCopy(s);
  };
  document.getElementById('imp').onclick=function(){document.getElementById('fileIn').click();};
  document.getElementById('pasteImp').onclick=function(){var s=prompt('복사해 둔 백업 내용을 붙여넣으세요');if(s)importText(s);};
  document.getElementById('mClose').onclick=closeSheet;
}
function fallbackCopy(s){var t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();
  try{document.execCommand('copy');toast('복사했어요');}catch(e){toast('복사 실패');}t.remove();}
function importText(s){
  try{var o=JSON.parse(s);if(!o||!o.months)throw 0;
    if(!confirm('지금 기록을 백업 내용으로 바꿀까요?'))return;
    D=o;fixD();save();closeSheet();render();
  }catch(e){alert('백업 내용이 올바르지 않아요.');}
}
document.getElementById('fileIn').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){importText(r.result);};r.readAsText(f);e.target.value='';
};

/* ---------- 시트 ---------- */
var sheetBg=document.getElementById('sheetBg');
function openSheet(html){document.getElementById('sheet').innerHTML=html;sheetBg.classList.add('show');}
function closeSheet(){sheetBg.classList.remove('show');}
sheetBg.addEventListener('click',function(e){if(e.target===sheetBg)closeSheet();});

/* ---------- 입력·클릭 ---------- */
view.addEventListener('input',function(e){
  var el=e.target,k=el.getAttribute('data-k');if(!k)return;
  setV(k,el.value);grow(el);saveSoon();
});
view.addEventListener('click',function(e){
  var t=e.target.closest('[data-openday],[data-road],[data-rtd],[data-rc],[data-area]');if(!t)return;
  if(t.hasAttribute('data-openday')){openPage('day',t.getAttribute('data-openday'));return;}
  if(t.hasAttribute('data-area')){editArea(+t.getAttribute('data-area'));return;}
  var m=month();
  if(t.hasAttribute('data-rc')){var r=m.routine[+t.getAttribute('data-rc')],d=+t.getAttribute('data-d');
    if(r.checks[d])delete r.checks[d];else r.checks[d]=true;}
  else{var dn=+D.sel.slice(8);
    if(t.hasAttribute('data-road')){var c=m.road.rows[+t.getAttribute('data-road')].cells;c[dn]=c[dn]===2?1:2;}
    else{var ck=m.routine[+t.getAttribute('data-rtd')].checks;if(ck[dn])delete ck[dn];else ck[dn]=true;}}
  save(true);scrollKeep(render);
});
window.addEventListener('pagehide',function(){save(true);});
document.addEventListener('visibilitychange',function(){if(document.hidden)save(true);});

/* ---------- 이동 ---------- */
function setSel(s){D.sel=s;D.cur=s.slice(0,7);}
function go(s){setSel(s);save(true);render();window.scrollTo(0,0);}
function openPage(id,s){if(s)setSel(s);D.tab=id;save(true);render();window.scrollTo(0,0);}
function step(n){
  var u=PG[D.tab].unit;
  if(u==='d')go(addDays(D.sel,n));
  else if(u==='w')go(addDays(D.sel,7*n));
  else if(u==='m'){var k=shift(D.cur,n);go(k===thisKey()?todayStr():k+'-01');}
}
document.getElementById('prevBtn').onclick=function(){step(-1);};
document.getElementById('nextBtn').onclick=function(){step(1);};
document.getElementById('label').onclick=function(){if(PG[D.tab].unit&&D.sel!==todayStr()){go(todayStr());toast('오늘로 왔어요');}};
document.getElementById('menuBtn').onclick=openMenu;
document.getElementById('idx').onclick=function(e){var b=e.target.closest('[data-page]');if(b)openPage(b.getAttribute('data-page'));};

load();
if(D.lastDay!==todayStr()){setSel(todayStr());D.lastDay=todayStr();D.tab='day';} // 날이 바뀌면 오늘 데일리부터
save(true);
render();
})();
</script>
</body>
</html>
